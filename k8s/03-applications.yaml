apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: proyecto-03
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: auth-service
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: proyecto03/auth-service:3.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        env:
        - name: AUTH_DB_URL
          value: jdbc:postgresql://auth-db:5432/auth_db
        - name: AUTH_DB_USERNAME
          value: postgres
        - name: AUTH_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_DB_PASSWORD
        - name: JWT_PUBLIC_KEY
          value: file:/app/keys/public.pem
        - name: JWT_PRIVATE_KEY
          value: file:/app/keys/private.pem
        - name: DEMO_USERS_ENABLED
          value: 'false'
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 40
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: rsa-keys
          mountPath: /app/keys
          readOnly: true
      volumes:
      - name: rsa-keys
        secret:
          secretName: rsa-keys
          items:
          - key: private.pem
            path: private.pem
          - key: public.pem
            path: public.pem

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: proyecto-03
spec:
  selector:
    app: auth-service
  ports:
  - port: 8081
    targetPort: 8081

