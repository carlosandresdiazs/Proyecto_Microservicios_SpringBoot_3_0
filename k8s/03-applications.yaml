      containers:
      - name: app
        image: proyecto03/payment-service:3.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8084
        env:
        - name: PAYMENT_DB_URL
          value: jdbc:postgresql://payments-db:5432/payments_db
        - name: PAYMENT_DB_USER
          value: payments_app
        - name: PAYMENT_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: PAYMENTS_DB_PASSWORD
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: WEBHOOK_SECRET
        - name: OAUTH_ISSUER_URI
          value: http://localhost:8085/realms/proyecto03
        - name: OAUTH_JWKS_URI
          value: http://keycloak:8080/realms/proyecto03/protocol/openid-connect/certs
        - name: OAUTH_AUDIENCE
          value: payments-api
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          initialDelaySeconds: 40
          periodSeconds: 10
        livenessProbe:
