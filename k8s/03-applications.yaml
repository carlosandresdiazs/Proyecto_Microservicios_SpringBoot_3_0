apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: proyecto-03
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: api-gateway
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: app
        image: proyecto03/api-gateway:3.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: AUTH_SERVICE_URL
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: USER_SERVICE_URL
        - name: PRODUCT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PRODUCT_SERVICE_URL
        - name: PAYMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PAYMENT_SERVICE_URL
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
      volumes: []

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: proyecto-03
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
