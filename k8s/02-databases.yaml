apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
  namespace: proyecto-03
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
  namespace: proyecto-03
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: auth-db
  template:
    metadata:
      labels: *id001
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: auth_db
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_DB_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U postgres -d auth_db
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: auth-data

---
apiVersion: v1
kind: Service
metadata:
  name: auth-db
  namespace: proyecto-03
spec:
  selector:
    app: auth-db
  ports:
  - port: 5432
    targetPort: 5432

