server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    issuer: proyecto03-auth
    expiration-minutes: 60
    public-key: ${JWT_PUBLIC_KEY:file:/app/keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:/app/keys/private.pem}
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
