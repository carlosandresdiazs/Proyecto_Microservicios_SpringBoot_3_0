server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: ${USER_SERVICE_URL:http://user-service:8082}
              predicates:
                - Path=/api/users/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8084}
              predicates:
                - Path=/api/payments/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://product-service:8083}
              predicates:
                - Path=/api/products/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGIN:http://localhost:8080}"
                allowedMethods: "*"
                allowedHeaders: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
